  ansible.builtin.set_fact:
    php_version: hhvm
  when: php_family == "hhvm"

- name: PHP | Ensure apt repository tooling for PPA support
  ansible.builtin.apt:
    name:
      - python3-apt
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 86400
  when: ansible_os_family == "Debian"
  become: true
  tags:
    - php
    - setup

- name: PHP | Determine whether packages.sury.org PHP repository is required
  ansible.builtin.set_fact:
    php_sury_needed: "{{ php_family | string in ['5.6', '7', '7.0', '7.1', '7.2', '7.3', '7.4', '8', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5'] }}"

- name: PHP | Remove legacy ondrej/php PPA repository if present
  ansible.builtin.deb822_repository:
    name: ondrej-php
    state: absent
  when: php_sury_needed
  become: true
  tags:
    - php
    - setup

- name: PHP | Remove legacy ondrej/php PPA list file if present
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/ondrej-ubuntu-php-{{ ansible_distribution_release }}.list"
    state: absent
  when: php_sury_needed
  become: true
  tags:
    - php
    - setup

- name: PHP | Fetch packages.sury.org PHP signing key
  ansible.builtin.get_url:
    url: "https://packages.sury.org/php/apt.gpg"
    dest: /usr/share/keyrings/deb.sury.org-php.gpg
    mode: "0644"
  retries: 3
  register: php_sury_key_result
  until: php_sury_key_result is not failed
  when: php_sury_needed
  become: true
  tags:
    - php
    - setup

- name: PHP | Add packages.sury.org PHP apt repository
  ansible.builtin.deb822_repository:
    name: sury-php
    types:
      - deb
    uris:
      - "https://packages.sury.org/php/"
    suites:
      - "{{ ansible_distribution_release }}"
    components:
      - main
    signed_by: /usr/share/keyrings/deb.sury.org-php.gpg
    state: present
    enabled: true
  register: php_sury_repo_result
  when: php_sury_needed
  become: true
  tags:
    - php
    - setup

- name: PHP | Update apt cache after adding PHP repository
  ansible.builtin.apt:
    update_cache: true
  when: php_sury_needed and php_sury_repo_result is changed
  become: true
  tags:
    - php
    - setup

- name: PHP | Default platform provided repository is used
  ansible.builtin.debug:
    msg: "Default platform available debs will be used for php."
  when: (php_family is not defined) or (php_family == "default")
