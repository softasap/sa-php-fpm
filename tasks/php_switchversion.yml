- name: PHP | Fix php family prefix for 8.5
  ansible.builtin.set_fact:
    php_version: "8.5"
    php_module_prefix: "php8.5"
    php_fpm_prefix: "php8.5"
  when: php_family == "8.5" or php_family == 8.5
  tags:
